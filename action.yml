# TypeTorch GitHub Action: build a TypeTorch (roblox-ts) game, and deploy it to a DEV-channel branch.
#
# Prod is never published from CI: prod deploys are signed with the owner's key files, which stay on the owner's PC.
# For a prod-channel branch this action only proposes: build, upload, moderation, the cloud test, then a proposal in
# its state dir, uploaded as the workflow artifact `typetorch-state-<run id>`. On the PC:
#   gh run download <run id> -n typetorch-state-<run id> -D ci-state
#   typetorch approve --import ci-state
#
# Dev deploys publish only when typetorch.json "approval" lets a non-person publish ("prod" or "none"); with "all" (the
# default) a dev deploy from CI becomes a proposal too. They need a shared seq source, because CI has no deployment log
# of its own: the game's DataStore (the deploy key with universe-datastores.objects:read, plus :create and :update to
# claim seqs atomically). The ConfigService registry would also do, but its read scope (universe:read) can't be granted
# to API keys today.
#
#   - uses: actions/checkout@v4
#     with: { fetch-depth: 0 }          # the deploy notes list the commits since the branch's last deploy
#   - uses: typetorch/cli@v0.7.0
#     with:
#       api-key: ${{ secrets.OPENCLOUD_API_KEY }}
name: TypeTorch
description: Build a TypeTorch game and deploy it to a dev-channel branch, or propose a prod deploy for the owner to approve and sign.
author: typetorch
branding:
  icon: upload-cloud
  color: orange

inputs:
  command:
    description: "deploy (default): build, upload, deploy (dev) or propose (prod). build: build only. test: the cloud test of the branch's newest upload."
    required: false
    default: deploy
  branch:
    description: TypeTorch branch. Default the CLI's own rule, typetorch.json "branches"[git branch], else the git branch lowercased with / as -.
    required: false
    default: ""
  working-directory:
    description: The game repo (the folder with typetorch.json).
    required: false
    default: "."
  api-key:
    description: Open Cloud API key for every job without its own (OPENCLOUD_API_KEY). Pass a secret, never a literal.
    required: false
    default: ""
  assets-key:
    description: Optional key for uploads and the cloud test (OPENCLOUD_ASSETS_KEY); asset read/write and Luau Execution read/write.
    required: false
    default: ""
  deploy-key:
    description: Optional key for deploy messages, the shared seq (DataStore) and the fleet (OPENCLOUD_DEPLOY_KEY).
    required: false
    default: ""
  message:
    description: Deploy note (shown in the dev menu). Default the head commit's subject.
    required: false
    default: ""
  test:
    description: "true: run the cloud test on dev deploys too (prod deploys always run it)."
    required: false
    default: "false"
  wait:
    description: Seconds to wait for the servers' reports after a dev deploy (empty = don't wait). Needs memory-store.sorted-map:read.
    required: false
    default: ""
  prod:
    description: "What a prod-channel branch does: propose (default; build, upload, cloud test, proposal artifact) or skip."
    required: false
    default: propose
  require-shared-seq:
    description: "true (default): stop before uploading when no shared seq source (the DataStore, or the registry) is readable, so a dev deploy never guesses its seq."
    required: false
    default: "true"
  cli-version:
    description: "@typetorch/cli version. Default the game's own devDependency, else the latest release."
    required: false
    default: ""
  bun-version:
    description: Bun version for setup-bun.
    required: false
    default: latest
  rokit:
    description: "true (default): install the tools pinned in the game's rokit.toml (Rojo, Lune) with setup-rokit."
    required: false
    default: "true"

outputs:
  branch:
    description: The TypeTorch branch.
    value: ${{ steps.target.outputs.branch }}
  channel:
    description: The branch's channel (prod or dev).
    value: ${{ steps.target.outputs.channel }}
  artifact-id:
    description: The artifact id (deploy).
    value: ${{ steps.run.outputs.artifact-id }}
  asset-id:
    description: The payload asset id (deploy).
    value: ${{ steps.run.outputs.asset-id }}
  seq:
    description: The deploy number (a published dev deploy).
    value: ${{ steps.run.outputs.seq }}
  proposal-id:
    description: The proposal to approve on the owner's PC (prod, or approval "all").
    value: ${{ steps.run.outputs.proposal-id }}

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Set up Rokit tools
      if: inputs.rokit == 'true'
      uses: CompeyDev/setup-rokit@v0.2.1
      with:
        path: ${{ inputs.working-directory }}
        cache: "true"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile

    - name: Find the CLI
      id: cli
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        if [ -n "$CLI_VERSION" ]; then
          echo "run=bunx --bun @typetorch/cli@$CLI_VERSION" >> "$GITHUB_OUTPUT"
        elif [ -x node_modules/.bin/typetorch ]; then
          echo "run=node_modules/.bin/typetorch" >> "$GITHUB_OUTPUT"
        else
          echo "run=bunx --bun @typetorch/cli@latest" >> "$GITHUB_OUTPUT"
        fi

    # The branch and its channel by the CLI's own rules (naming.ts): --branch, else "branches"[git branch], else the git
    # branch lowercased with "/" as "-"; channel = "channels"[branch], else prod for "defaultBranch", else dev.
    - name: Target branch
      id: target
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        node -e '
          const c = JSON.parse(require("fs").readFileSync("typetorch.json", "utf8"));
          const git = process.env.GIT_BRANCH;
          const branch = process.env.INPUT_BRANCH || (c.branches || {})[git] || git.toLowerCase().replace(/\//g, "-");
          const channel = (c.channels || {})[branch] || (branch === (c.defaultBranch || "prod") ? "prod" : "dev");
          const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          out.end(`branch=${branch}\nchannel=${channel}\n`);
          console.log(`TypeTorch branch ${branch} (${channel} channel)`);
        '

    - name: TypeTorch ${{ inputs.command }}
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OPENCLOUD_API_KEY: ${{ inputs.api-key }}
        OPENCLOUD_ASSETS_KEY: ${{ inputs.assets-key }}
        OPENCLOUD_DEPLOY_KEY: ${{ inputs.deploy-key }}
        TYPETORCH_STATE_DIR: ${{ runner.temp }}/typetorch-state
        TYPETORCH_PROPOSED_BY: ci
        TT_CLI: ${{ steps.cli.outputs.run }}
        TT_COMMAND: ${{ inputs.command }}
        TT_BRANCH: ${{ steps.target.outputs.branch }}
        TT_CHANNEL: ${{ steps.target.outputs.channel }}
        TT_MESSAGE: ${{ inputs.message }}
        TT_TEST: ${{ inputs.test }}
        TT_WAIT: ${{ inputs.wait }}
        TT_REQUIRE_SHARED_SEQ: ${{ inputs.require-shared-seq }}
        TT_PROD: ${{ inputs.prod }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/typetorch-out.json"
        case "$TT_COMMAND" in
          build)
            $TT_CLI build --branch "$TT_BRANCH" --clean
            exit 0
            ;;
          test)
            $TT_CLI test --cloud --branch "$TT_BRANCH"
            exit 0
            ;;
          deploy) ;;
          *)
            echo "::error::command must be deploy, build or test (got $TT_COMMAND)"
            exit 2
            ;;
        esac
        if [ "$TT_CHANNEL" = "prod" ] && [ "$TT_PROD" = "skip" ]; then
          echo "::notice::$TT_BRANCH is a prod-channel branch: not deployed from CI (prod: skip)"
          exit 0
        fi
        args=(deploy --branch "$TT_BRANCH" --json --message "${TT_MESSAGE:-$(git log -1 --format=%s)}")
        if [ "$TT_CHANNEL" = "prod" ]; then
          # Never published from CI: the owner approves (and signs) on their PC. The cloud test runs here first.
          args+=(--propose --no-wait)
        else
          if [ "$TT_TEST" = "true" ]; then args+=(--test); fi
          if [ -n "$TT_WAIT" ]; then args+=(--wait "$TT_WAIT"); else args+=(--no-wait); fi
          if [ "$TT_REQUIRE_SHARED_SEQ" = "true" ]; then args+=(--require-shared-seq); fi
        fi
        status=0
        $TT_CLI "${args[@]}" > "$out" || status=$?
        node -e '
          const fs = require("fs");
          let r = {};
          try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch {}
          const d = r.deployment || {}, p = r.proposal || {};
          const lines = [
            `artifact-id=${d.artifactId || (p.artifact || {}).artifactId || ""}`,
            `asset-id=${d.assetId || (p.artifact || {}).assetId || ""}`,
            `seq=${d.seq || ""}`,
            `proposal-id=${p.id || ""}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          const summary = p.id
            ? `### TypeTorch: proposed ${p.kind} ${(p.artifact || {}).artifactId} to ${p.branch}\n\nNothing was published. On your PC:\n\n\`\`\`\ngh run download ${process.env.GITHUB_RUN_ID} -n typetorch-state-${process.env.GITHUB_RUN_ID} -D ci-state\ntypetorch approve --import ci-state ${p.id}\n\`\`\`\n`
            : d.seq
              ? `### TypeTorch: deployed #${d.seq} ${d.branch} ${d.artifactId} (asset ${d.assetId})\n`
              : "";
          if (summary && process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
        ' "$out"
        exit $status

    - name: Keep the state dir (proposals, uploads, tests)
      if: always() && inputs.command == 'deploy'
      uses: actions/upload-artifact@v4
      with:
        name: typetorch-state-${{ github.run_id }}
        path: ${{ runner.temp }}/typetorch-state
        if-no-files-found: ignore
        retention-days: 2
